name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/verify_benchmark.py
      - run: python -m compileall -q src benchmark scripts
      - run: python -m ruff check src scripts tests/test_public_workflow.py tests/test_public_benchmark.py
      - run: git diff --check
